<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <title>칵테일 레시피</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="title-block">
        <p class="eyebrow">RECIPES</p>
        <h1>칵테일 레시피</h1>
      </div>
      <button id="favToggleBtn" class="icon-btn" aria-label="즐겨찾기 보기">
        <svg viewBox="0 0 24 24" class="icon star-icon"><path d="M12 3.5l2.6 5.6 6.1.6-4.6 4.1 1.3 6-5.4-3.1-5.4 3.1 1.3-6-4.6-4.1 6.1-.6z"/></svg>
      </button>
    </header>

    <div class="search-bar" id="searchBar">
      <svg viewBox="0 0 24 24" class="icon search-icon"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1114 9.5 4.5 4.5 0 019.5 14z"/></svg>
      <input type="search" id="searchInput" placeholder="칵테일 이름, 재료로 검색" autocomplete="off" />
    </div>

    <div class="filter-row" id="baseFilters"></div>

    <main id="listView" class="list-view">
      <div id="cardGrid" class="card-grid"></div>
      <p id="emptyState" class="empty-state hidden">검색 결과가 없어요</p>
    </main>

    <section id="detailView" class="detail-view hidden">
      <button id="backBtn" class="back-btn">
        <svg viewBox="0 0 24 24" class="icon chevron-icon"><path d="M15.5 4.5l-7 7.5 7 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        목록
      </button>
      <div id="detailContent"></div>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
