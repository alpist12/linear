<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1513" />
  <title>칵테일 레시피</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="title-block">
        <p class="eyebrow">No. 01 &mdash; RECIPE BOOK</p>
        <h1>칵테일 레시피</h1>
      </div>
      <button id="favToggleBtn" class="icon-btn" aria-label="즐겨찾기 보기">
        <svg viewBox="0 0 24 24" class="icon star-icon"><path d="M12 3.4l2.47 5.32 5.86.57-4.4 3.9 1.24 5.74-5.17-2.98-5.17 2.98 1.24-5.74-4.4-3.9 5.86-.57z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
    </header>

    <div class="search-bar" id="searchBar">
      <svg viewBox="0 0 24 24" class="icon search-icon"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1114 9.5 4.5 4.5 0 019.5 14z"/></svg>
      <input type="search" id="searchInput" placeholder="칵테일 또는 재료 검색" autocomplete="off" />
    </div>

    <div class="filter-row" id="baseFilters"></div>

    <main id="listView" class="list-view">
      <div id="cardGrid" class="cocktail-list"></div>
      <p id="emptyState" class="empty-state hidden">일치하는 레시피가 없습니다</p>
    </main>

    <section id="detailView" class="detail-view hidden">
      <button id="backBtn" class="back-btn">
        <svg viewBox="0 0 24 24" class="icon chevron-icon"><path d="M15.5 4.5l-7 7.5 7 7.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        목록으로
      </button>
      <div id="detailContent"></div>
    </section>
  </div>

  <script src="js/glassIcons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
