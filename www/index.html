<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#14121a" />
  <title>칵테일 레시피</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>🍸 칵테일 레시피</h1>
      <button id="favToggleBtn" class="icon-btn" aria-label="즐겨찾기 보기">☆</button>
    </header>

    <div class="search-bar" id="searchBar">
      <input type="search" id="searchInput" placeholder="칵테일 이름, 재료로 검색" autocomplete="off" />
    </div>

    <div class="filter-row" id="baseFilters"></div>

    <main id="listView" class="list-view">
      <div id="cardGrid" class="card-grid"></div>
      <p id="emptyState" class="empty-state hidden">검색 결과가 없어요 🥲</p>
    </main>

    <section id="detailView" class="detail-view hidden">
      <button id="backBtn" class="back-btn">← 목록으로</button>
      <div id="detailContent"></div>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
