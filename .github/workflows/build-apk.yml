name: Build Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cocktail-recipes-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release (login-free download)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk cocktail-recipes.apk
          gh release delete apk-latest --yes || true
          git push origin :refs/tags/apk-latest || true
          gh release create apk-latest cocktail-recipes.apk \
            --title "칵테일 레시피 APK (최신 빌드)" \
            --notes "커밋 ${{ github.sha }} 기준 자동 빌드된 디버그 APK입니다. 로그인 없이 아래 첨부파일을 다운로드해 설치하세요." \
            --target "${{ github.sha }}"
